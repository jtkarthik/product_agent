apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: product-query-agent
  version: 1.0.0

type: agent

provides:
  apis:
    - name: product-query-agent
      kind: a2a
      ordId: customer.build:apiResource:product-query-agent-2f8c2.product-query-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-api-product-srv-mcp
    kind: mcp-server
    ordId: customer.build:apiResource:product-query-agent-2f8c2.sap-s4-api-product-srv-mcp-server:v1
  - name: sap-s4-api-clfn-product-srv-mcp
    kind: mcp-server
    ordId: customer.build:apiResource:product-query-agent-2f8c2.sap-s4-api-clfn-product-srv-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
